name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # shell.nix includes `claude-code`, an unfree package, for local dev -
  # nixpkgs refuses to evaluate it without this.
  NIXPKGS_ALLOW_UNFREE: 1

# fyde-scripts is part of the multi-repo fyde project (see ../CLAUDE.md):
# it depends on ../sdk via a `path` dependency, which in turn depends on
# ../api-protos, so every job that touches Cargo checks out all three repos
# as siblings under the runner's workspace, mirroring the local dev layout.
jobs:
  lua-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scripts

      - uses: cachix/install-nix-action@v30
        with:
          # cachix/install-nix-action doesn't set up NIX_PATH on its own, so
          # `<nixpkgs>` (used by shell.nix and by `nix-shell -p` below) fails
          # to resolve without this.
          nix_path: nixpkgs=channel:nixos-unstable

      - name: luacheck
        working-directory: scripts
        run: nix-shell -p luaPackages.luacheck --run "luacheck scrapers/"

  lua-check:
    runs-on: ubuntu-latest
    steps:
      # fyde-sdk's dependency tree (wry/webkitgtk/BoringSSL, for the
      # scrapers domain's embedded browser and HTTP client) doesn't fit in
      # ubuntu-latest's default ~14GB free disk alongside its preinstalled
      # toolchains - free up the ones this job doesn't need.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          path: scripts

      - uses: actions/checkout@v4
        with:
          repository: fyde-lab/sdk
          path: sdk

      - uses: actions/checkout@v4
        with:
          repository: fyde-lab/api-protos
          path: api-protos

      # ../sdk's build.rs shells out to `buf export` to pull api-protos'
      # published module - shell.nix itself doesn't provide `buf` (it comes
      # from the top-level monorepo shell.nix locally; see ../CLAUDE.md).
      - uses: bufbuild/buf-setup-action@v1

      - uses: cachix/install-nix-action@v30
        with:
          # cachix/install-nix-action doesn't set up NIX_PATH on its own, so
          # `<nixpkgs>` (used by shell.nix and by `nix-shell -p` below) fails
          # to resolve without this.
          nix_path: nixpkgs=channel:nixos-unstable

      - name: cargo run -- check
        working-directory: scripts
        run: nix-shell --run "cargo run -- check"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scripts

      - uses: actions/checkout@v4
        with:
          repository: fyde-lab/sdk
          path: sdk

      - uses: actions/checkout@v4
        with:
          repository: fyde-lab/api-protos
          path: api-protos

      - uses: cachix/install-nix-action@v30
        with:
          # cachix/install-nix-action doesn't set up NIX_PATH on its own, so
          # `<nixpkgs>` (used by shell.nix and by `nix-shell -p` below) fails
          # to resolve without this.
          nix_path: nixpkgs=channel:nixos-unstable

      - name: cargo fmt --check
        working-directory: scripts
        run: nix-shell --run "cargo fmt --check"

  clippy:
    runs-on: ubuntu-latest
    steps:
      # See the lua-check job's comment on this step.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          path: scripts

      - uses: actions/checkout@v4
        with:
          repository: fyde-lab/sdk
          path: sdk

      - uses: actions/checkout@v4
        with:
          repository: fyde-lab/api-protos
          path: api-protos

      # ../sdk's build.rs shells out to `buf export` to pull api-protos'
      # published module - shell.nix itself doesn't provide `buf` (it comes
      # from the top-level monorepo shell.nix locally; see ../CLAUDE.md).
      - uses: bufbuild/buf-setup-action@v1

      - uses: cachix/install-nix-action@v30
        with:
          # cachix/install-nix-action doesn't set up NIX_PATH on its own, so
          # `<nixpkgs>` (used by shell.nix and by `nix-shell -p` below) fails
          # to resolve without this.
          nix_path: nixpkgs=channel:nixos-unstable

      - name: cargo clippy
        working-directory: scripts
        run: nix-shell --run "cargo clippy --all-targets -- -D warnings"

  build:
    runs-on: ubuntu-latest
    steps:
      # See the lua-check job's comment on this step.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          path: scripts

      - uses: actions/checkout@v4
        with:
          repository: fyde-lab/sdk
          path: sdk

      - uses: actions/checkout@v4
        with:
          repository: fyde-lab/api-protos
          path: api-protos

      # ../sdk's build.rs shells out to `buf export` to pull api-protos'
      # published module - shell.nix itself doesn't provide `buf` (it comes
      # from the top-level monorepo shell.nix locally; see ../CLAUDE.md).
      - uses: bufbuild/buf-setup-action@v1

      - uses: cachix/install-nix-action@v30
        with:
          # cachix/install-nix-action doesn't set up NIX_PATH on its own, so
          # `<nixpkgs>` (used by shell.nix and by `nix-shell -p` below) fails
          # to resolve without this.
          nix_path: nixpkgs=channel:nixos-unstable

      - name: cargo build
        working-directory: scripts
        run: nix-shell --run "cargo build"
